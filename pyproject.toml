[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
# Lagom strikt baslinje: koden har aldrig lintats tidigare, så en
# fullständig sanering av all befintlig kod är ett eget projekt. Detta
# fångar de vanligaste riktiga felen utan att dränka i stilfrågor.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # radlängd - line-length ovan är en riktlinje, inte en hård gräns än
    "B008",  # FastAPI:s File(...)/Depends(...) i default-argument är det idiomatiska mönstret
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Befintlig kod har inte typats fullt ut överallt - börja tillåtande och
# skärp efterhand istället för att kräva en stor engångssanering.
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
